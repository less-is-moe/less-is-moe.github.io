<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Less is MoE: Trimming Experts in Domain-Specialist Language Models">
  <title>Less is MoE</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #fff;
      --foreground: #1d1d1f;
      --muted: #66666d;
      --line: #e8e8ec;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #161618;
        --foreground: #f5f5f7;
        --muted: #aaaab2;
        --line: #303034;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--foreground);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      height: 64px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 clamp(20px, 5vw, 72px);
      font-size: 16px;
      font-weight: 700;
    }

    main {
      min-height: calc(100vh - 64px);
      display: grid;
      place-items: center;
      padding: 48px 24px 96px;
    }

    .hero {
      width: min(980px, 100%);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 84px);
      line-height: 1.04;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    p {
      max-width: 800px;
      margin: 32px auto 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.8;
      text-wrap: balance;
    }
  </style>
</head>
<body>
  <header>Less is MoE</header>
  <main>
    <section class="hero">
      <h1>Less is MoE: Trimming Experts in Domain-Specialist Language Models</h1>
      <p>Haoze He, Xinkai Zou, Xuan Jiang, Xingyuan Ding,<br>Ao Qu, Juncheng Billy Li, Heather Miller</p>
    </section>
  </main>
</body>
</html>
